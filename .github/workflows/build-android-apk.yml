name: Build Konnect Me Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'apply-branding-android.sh'
      - 'apply-branding.sh'
      - 'branding/android/**'
      - 'android-trigger.txt'

permissions:
  contents: write

concurrency:
  group: konnect-android-apk
  cancel-in-progress: true

env:
  RUSTDESK_TAG: "1.4.9"
  VERSION: "1.4.9"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # self-signed keystore for sideload APKs (see note in the release body)
  KS_PASS: "konnectme2026"

jobs:
  build-apk:
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64,  target: aarch64-linux-android,   abi: arm64-v8a,     platform: android-arm64, ndklib: aarch64-linux-android }
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GHA cache env
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libasound2-dev libc6-dev libclang-dev libunwind-dev libgtk-3-dev \
            libpam0g-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Pin libclang 15 for bindgen (scrap/hwcodec)
        run: |
          python3 -m pip install "libclang==15.0.6.1" --target "$HOME/libclang15" --break-system-packages \
            || python3 -m pip install "libclang==15.0.6.1" --target "$HOME/libclang15"
          SO="$(find "$HOME/libclang15" -name 'libclang*.so*' | head -1)"
          echo "libclang -> $SO"
          echo "LIBCLANG_PATH=$(dirname "$SO")" >> "$GITHUB_ENV"

      - name: Checkout branding repo
        uses: actions/checkout@v4
        with:
          path: branding-repo

      - name: Clone RustDesk source
        run: git clone --depth 1 --branch "$RUSTDESK_TAG" --recurse-submodules https://github.com/rustdesk/rustdesk rustdesk

      - name: Apply Konnect Me (Android) branding
        working-directory: rustdesk
        run: bash "$GITHUB_WORKSPACE/branding-repo/apply-branding-android.sh" "$GITHUB_WORKSPACE/branding-repo/branding"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter (3.24.5 dropdown filter)
        working-directory: rustdesk
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" || echo "flutter patch skipped"

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Build vcpkg dependencies (${{ matrix.job.abi }})
        working-directory: rustdesk
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" -exec sh -c 'echo "== $1 =="; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Build librustdesk.so (${{ matrix.job.abi }})
        working-directory: rustdesk
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh 2>&1 | tee "$GITHUB_WORKSPACE/lib.log"
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so

      - name: Build APK
        working-directory: rustdesk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # use debug signing config so the release build succeeds; we re-sign below
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndklib }}/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi 2>&1 | tee "$GITHUB_WORKSPACE/apk.log"
          popd
          ls -la flutter/build/app/outputs/flutter-apk/

      - name: Sign APK with persistent Konnect keystore
        run: |
          set -e
          KS="$GITHUB_WORKSPACE/branding-repo/konnect-release.jks"
          KT=/usr/lib/jvm/java-17-openjdk-amd64/bin/keytool
          if [ ! -f "$KS" ]; then
            "$KT" -genkeypair -v -keystore "$KS" -alias konnectme -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Konnect Me, O=Rootkore, C=DE"
            echo "KS_NEW=1" >> "$GITHUB_ENV"
            echo "generated new keystore"
          fi
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools/" | sort -V | tail -1)
          echo "build-tools: $BT"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          IN="rustdesk/flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk"
          OUT="$GITHUB_WORKSPACE/Konnect-Me-${VERSION}-${{ matrix.job.arch }}.apk"
          "$ZIPALIGN" -f -p 4 "$IN" "$GITHUB_WORKSPACE/aligned.apk"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias konnectme \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "$OUT" "$GITHUB_WORKSPACE/aligned.apk"
          "$APKSIGNER" verify --verbose "$OUT" | head
          ls -la "$OUT"
          SZ=$(stat -c%s "$OUT"); echo "APK size: $SZ"
          [ "$SZ" -gt 8000000 ] || { echo "APK too small"; exit 1; }

      - name: Persist keystore + build log to repo (always)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/branding-repo"
          A="${{ matrix.job.arch }}"
          { echo "### apk.log tail ###"; tail -c 9000 "$GITHUB_WORKSPACE/apk.log" 2>/dev/null; \
            echo; echo "### lib.log tail ###"; tail -c 5000 "$GITHUB_WORKSPACE/lib.log" 2>/dev/null; } > "ci-android-$A.txt"
          git config user.email "ci@rootkore.com"; git config user.name "ci"
          for i in 1 2 3 4 5; do
            git add "ci-android-$A.txt" konnect-release.jks 2>/dev/null || git add "ci-android-$A.txt"
            git commit -m "CI android log $A [skip ci]" || true
            git pull --rebase -q origin main 2>/dev/null || true
            git push origin main 2>/dev/null && break || sleep 3
          done

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Konnect-Me-${{ matrix.job.arch }}
          path: Konnect-Me-*.apk
          if-no-files-found: warn

      - name: Publish APK to a public Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ matrix.job.arch }}"
          APK="$GITHUB_WORKSPACE/Konnect-Me-${VERSION}-${{ matrix.job.arch }}.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Konnect Me Android (${{ matrix.job.arch }})" \
            --notes "Automated Konnect Me Android build. Self-signed sideload APK — enable 'Install unknown apps' to install." 2>/dev/null || true
          [ -f "$APK" ] && gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY" || echo "no APK to upload"
